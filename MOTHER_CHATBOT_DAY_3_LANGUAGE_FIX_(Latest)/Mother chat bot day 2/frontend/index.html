<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>MAA Project</title>

  <style>

    :root{
      --primary:#4a7c5e;
      --primary-dark:#356345;
      --primary-light:#5a9070;
      --accent:#e8a87c;
      --bg-soft:#f8f9f7;
      --bg-lighter:#fafbf9;
      --text-primary:#1a1f1c;
      --text-secondary:#5a6360;
      --border-light:#e5e8e4;
      --success-bg:#e8f5e9;
      --error-text:#c62828
    }

    *{
      box-sizing:border-box
    }

    html,body{
      margin:0;
      padding:0;
      height:100%;
      width:100%
    }

    body{
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
      background:linear-gradient(135deg,#f5f9f6 0%,#f9f7f3 100%);
      color:var(--text-primary);
      display:flex;
      justify-content:center;
      align-items:center
    }

    .app{
      width:min(100%,840px);
      height:100%;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      background:var(--bg-lighter);
      box-shadow:0 10px 40px rgba(0,0,0,.08)
    }

    header{
      background:linear-gradient(135deg,#fff 0%,#fafcf8 100%);
      padding:clamp(24px,5vw,36px) clamp(24px,5vw,44px);
      border-bottom:1px solid var(--border-light);
      display:flex;
      align-items:flex-start;
      gap:16px;
      box-shadow:0 1px 3px rgba(0,0,0,.05)
    }

    .header-icon{
      flex-shrink:0;
      width:44px;
      height:44px;
      border-radius:12px;
      background:linear-gradient(135deg,var(--primary),var(--primary-light));
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:22px;
      color:#fff
    }

    .header-content{
      flex:1;
      min-width:0
    }

    header h1{
      font-size:clamp(24px,4vw,32px);
      font-weight:600;
      margin:0 0 6px;
      color:var(--text-primary);
      letter-spacing:-0.3px
    }

    header p{
      font-size:14px;
      margin:0;
      color:var(--text-secondary);
      line-height:1.5
    }

    #history{
      flex:1;
      min-height:0;
      overflow-y:auto;
      padding:clamp(20px,4vw,32px) clamp(20px,5vw,40px);
      display:flex;
      flex-direction:column;
      gap:14px;
      scroll-behavior:smooth;
      background:var(--bg-soft)
    }

    #history::-webkit-scrollbar{
      width:8px
    }

    #history::-webkit-scrollbar-track{
      background:transparent
    }

    #history::-webkit-scrollbar-thumb{
      background:#d0d5d0;
      border-radius:4px
    }

    #history::-webkit-scrollbar-thumb:hover{
      background:#b8beb8
    }

    .message{
      max-width:min(82%,580px);
      padding:12px 16px;
      border-radius:16px;
      line-height:1.5;
      white-space:pre-wrap;
      overflow-wrap:break-word;
      animation:fadeIn .3s ease-out
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(8px)
      }

      to{
        opacity:1;
        transform:translateY(0)
      }
    }

    .user{
      align-self:flex-end;
      background:var(--primary);
      color:#fff;
      border-radius:16px 16px 4px 16px;
      box-shadow:0 2px 8px rgba(74,124,94,.15);
      font-weight:500
    }

    .assistant{
      align-self:flex-start;
      background:#fff;
      border:1px solid var(--border-light);
      border-radius:16px 16px 16px 4px;
      box-shadow:0 2px 8px rgba(0,0,0,.05);
      color:var(--text-primary)
    }

    .system{
      align-self:center;
      max-width:90%;
      padding:8px 0;
      color:var(--text-secondary);
      font-size:13px;
      text-align:center;
      box-shadow:none;
      font-style:italic
    }

    #status{
      min-height:20px;
      padding:8px clamp(20px,5vw,40px);
      font-size:13px;
      background:var(--bg-soft);
      border-top:1px solid var(--border-light);
      color:var(--text-secondary);
      text-align:center
    }

    #status.error{
      color:var(--error-text)
    }

    form{
      display:flex;
      gap:10px;
      padding:16px clamp(20px,5vw,40px);
      background:#fff;
      border-top:1px solid var(--border-light);
      position:sticky;
      bottom:0
    }

    .input-wrapper{
      flex:1;
      display:flex;
      align-items:flex-end;
      min-width:0;
      position:relative
    }

    textarea{
      flex:1;
      min-width:0;
      resize:none;
      min-height:48px;
      max-height:120px;
      padding:12px 14px;
      border:1.5px solid var(--border-light);
      border-radius:12px;
      background:var(--bg-soft);
      color:var(--text-primary);
      font:inherit;
      font-size:14px;
      line-height:1.4;
      outline:none;
      transition:border-color .2s,box-shadow .2s
    }

    textarea::placeholder{
      color:#a0a8a2
    }

    textarea:focus{
      border-color:var(--primary);
      box-shadow:0 0 0 3px rgba(74,124,94,.1)
    }

    button{
      flex-shrink:0;
      width:48px;
      height:48px;
      border:none;
      border-radius:12px;
      background:var(--primary);
      color:#fff;
      font:inherit;
      font-weight:600;
      font-size:13px;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      transition:background .15s ease,transform .1s ease;
      box-shadow:0 2px 6px rgba(74,124,94,.2)
    }

    button:hover:not(:disabled){
      background:var(--primary-dark);
      transform:translateY(-1px);
      box-shadow:0 4px 12px rgba(74,124,94,.3)
    }

    button:active:not(:disabled){
      transform:translateY(0)
    }

    button:disabled{
      opacity:.5;
      cursor:not-allowed
    }

    @media (max-width:640px){

      .app{
        box-shadow:none;
        height:100vh
      }

      header{
        padding:18px 16px
      }

      .header-icon{
        width:40px;
        height:40px;
        font-size:20px
      }

      header h1{
        font-size:20px;
        margin-bottom:4px
      }

      header p{
        font-size:13px
      }

      #history{
        padding:16px 12px;
        gap:12px
      }

      .message{
        max-width:85%
      }

      #status{
        padding:8px 12px;
        font-size:12px
      }

      form{
        padding:12px 12px 16px;
        gap:8px
      }

      textarea{
        min-height:44px;
        max-height:100px;
        padding:10px 12px;
        font-size:13px
      }

      button{
        width:44px;
        height:44px;
        font-size:12px
      }

    }

  </style>

</head>

<body>

  <main class="app">

    <header>

      <div class="header-icon">✨</div>

      <div class="header-content">

        <h1>MAA Project</h1>

        <p>Your thoughtful AI companion for everyday conversation</p>

      </div>

    </header>

    <section id="history" aria-live="polite"></section>

    <div id="status"></div>

    <form id="chat-form">

      <div class="input-wrapper">

        <textarea
          id="message"
          placeholder="Type your message..."
          aria-label="Message"
        ></textarea>

      </div>

      <button
        id="send"
        type="submit"
        aria-label="Send message"
      >➤</button>

    </form>

  </main>

<script>

const sessionId =
  sessionStorage.getItem('mother_session_id') ||
  crypto.randomUUID();

sessionStorage.setItem(
  'mother_session_id',
  sessionId
);

const userId =
  sessionStorage.getItem('mother_user_id') ||
  crypto.randomUUID();

sessionStorage.setItem(
  'mother_user_id',
  userId
);

const history =
  document.getElementById('history');

const form =
  document.getElementById('chat-form');

const input =
  document.getElementById('message');

const send =
  document.getElementById('send');

const status =
  document.getElementById('status');


function addMessage(role,text){

  const el=document.createElement('div');

  el.className='message '+role;

  if(role==='assistant'){

    el.textContent='';

    history.appendChild(el);

    history.scrollTop=history.scrollHeight;

    return el;

  }

  el.textContent=text;

  history.appendChild(el);

  history.scrollTop=history.scrollHeight;

  return el;

}


addMessage(
  'system',
  "I'm here to listen. What is on your mind?"
);


form.addEventListener(
  'submit',
  async e => {

    e.preventDefault();

    const message=input.value.trim();

    if(!message || send.disabled){
      return;
    }


    addMessage(
      'user',
      message
    );

    input.value='';

    send.disabled=true;

    status.textContent='Assistant is thinking...';


    try{

      const assistantEl =
        addMessage(
          'assistant',
          ''
        );

      const r =
        await fetch(
          '/chat/stream',
          {
            method:'POST',

            headers:{
              'Content-Type':'application/json'
            },

            body:JSON.stringify({
              user_id:userId,
              session_id:sessionId,
              message:message
            })
          }
        );

      if(!r.ok){
        throw new Error(
          'The server returned '+r.status
        );
      }

      if(!r.body){
        throw new Error(
          'ReadableStream not supported in response.'
        );
      }

      const reader = r.body.getReader();
      const decoder = new TextDecoder('utf-8');
      let receivedAny = false;

      while(true){
        const {done, value} = await reader.read();
        if(done){
          const finalChunk = decoder.decode();
          if(finalChunk){
            assistantEl.textContent += finalChunk;
            receivedAny = true;
          }
          break;
        }
        if(value){
          const chunk = decoder.decode(value, {stream: true});
          if(chunk){
            assistantEl.textContent += chunk;
            receivedAny = true;
            history.scrollTop = history.scrollHeight;
          }
        }
      }

      if(!receivedAny){
        throw new Error(
          'The server returned no response.'
        );
      }

      status.textContent='';

    }catch(err){

      console.error(
        'Chat request failed:',
        err
      );

      status.textContent =
        'Sorry, I could not respond right now. Please try again.';

      status.classList.add('error');


    }finally{

      send.disabled=false;

      input.focus();

    }

  }
);


input.addEventListener(
  'keydown',
  e => {

    if(
      e.key==='Enter' &&
      !e.shiftKey
    ){

      e.preventDefault();

      form.requestSubmit();

    }

  }
);

</script>

</body>

</html>
